name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          mkdir -p $GITHUB_WORKSPACE/builds
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson || true
          cp -f **/build/*.cs3 $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          # Linkleri GitHub Pages formatına dönüştür:
          sed -i 's|raw.githubusercontent.com/cevherneciponat-design/TestPlugins/builds|cevherneciponat-design.github.io/TestPlugins|g' $GITHUB_WORKSPACE/builds/plugins.json

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Build with Korkuyorum Anne provider - $GITHUB_SHA" || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:builds --force || true