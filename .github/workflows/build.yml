name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"
          token: ${{ secrets.BOT_TOKEN }}

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          mkdir -p $GITHUB_WORKSPACE/builds
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make || true
          cp -f **/build/*.cs3 $GITHUB_WORKSPACE/builds/ 2>/dev/null || true

      - name: Generate CloudStream Manifests
        run: |
          cd $GITHUB_WORKSPACE/builds
          
          # Manifest/plugins.json dosyasını standart CloudStream formatında oluştur
          cat << 'EOF' > plugins.json
          [
            {
              "name": "ExampleProvider",
              "pluginUrl": "https://raw.githubusercontent.com/cevherneciponat-design/TestPlugins/builds/ExampleProvider.cs3",
              "version": 1,
              "url": "https://raw.githubusercontent.com/cevherneciponat-design/TestPlugins/builds/ExampleProvider.cs3",
              "manifestVersion": 1,
              "authors": ["cevherneciponat-design"],
              "status": 1,
              "tvTypes": ["Movie"]
            }
          ]
          EOF

          # repo.json dosyasını oluştur
          cat << 'EOF' > repo.json
          {
            "name": "TestPlugins",
            "pluginUrl": "https://raw.githubusercontent.com/cevherneciponat-design/TestPlugins/builds/plugins.json"
          }
          EOF

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || true
          git push https://x-access-token:${{ secrets.BOT_TOKEN }}@github.com/${{ github.repository }}.git HEAD:builds --force || true